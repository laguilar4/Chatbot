server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # DNS interno de Docker: resuelve "server" en cada petición,
        # así Nginx no se queda con una IP vieja si el contenedor se reinicia.
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://server:4000;
        proxy_pass $api_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rutas de React Router (por ejemplo /admin)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
